<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel · Service Desk · ServitecBAQ</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/vnd.microsoft.icon" href="../favicon.ico">
    <link rel="apple-touch-icon" href="../img/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="soporte.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ====== PROTECCIÓN DE ACCESO ====== -->
<script>
    // La validación real la hace el Apps Script en cada petición; esto
    // solo evita mostrar el panel sin sesión.
    if (sessionStorage.getItem('sb_sd_autenticado') !== 'true' || !sessionStorage.getItem('sb_sd_token')) {
        window.location.href = 'login.html';
    }
</script>

<!-- ====== BARRA SUPERIOR ====== -->
<header class="topbar">
    <div class="topbar-content">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 208 208" width="24" height="24" aria-hidden="true" focusable="false"><g fill="currentColor"><polygon points="8,70 128,10 164,28 60,80 96,98 96,134 8,90"/><polygon points="200,138 80,198 44,180 148,128 112,110 112,74 200,118"/></g></svg>
            </div>
            <div class="brand-text">
                <h1>ServitecBAQ</h1>
                <span>Service Desk</span>
            </div>
        </div>
        <div class="topbar-actions">
            <a href="../index.html" class="btn-volver" title="Volver al sitio">
                <svg viewBox="0 0 24 24" fill="none" width="15" height="15" aria-hidden="true"><path d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Volver
            </a>
            <button type="button" class="btn-logout" id="btnLogout" title="Cerrar sesión">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="lector-solo">Cerrar sesión</span>
            </button>
            <div class="user-chip">
                <div class="user-avatar" id="userAvatar">?</div>
                <span id="userNombre">Agente</span>
            </div>
        </div>
    </div>
</header>

<main class="panel-layout">

    <!-- ====== CONTADORES POR ESTADO ====== -->
    <section class="stats-grid" id="statsGrid" aria-label="Tickets por estado">
        <button type="button" class="stat-chip is-activo" data-filtro="">
            <div class="stat-ico">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H6.911a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
                <div class="stat-num" data-contador="Total">0</div>
                <div class="stat-txt">Total</div>
            </div>
        </button>
        <button type="button" class="stat-chip" data-filtro="Nuevo">
            <div class="stat-ico">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </div>
            <div>
                <div class="stat-num" data-contador="Nuevo">0</div>
                <div class="stat-txt">Nuevos</div>
            </div>
        </button>
        <button type="button" class="stat-chip" data-filtro="En curso">
            <div class="stat-ico">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
                <div class="stat-num" data-contador="En curso">0</div>
                <div class="stat-txt">En curso</div>
            </div>
        </button>
        <button type="button" class="stat-chip" data-filtro="En espera">
            <div class="stat-ico">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
                <div class="stat-num" data-contador="En espera">0</div>
                <div class="stat-txt">En espera</div>
            </div>
        </button>
        <button type="button" class="stat-chip" data-filtro="Resuelto">
            <div class="stat-ico">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="m4.5 12.75 6 6 9-13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
                <div class="stat-num" data-contador="Resuelto">0</div>
                <div class="stat-txt">Resueltos</div>
            </div>
        </button>
        <button type="button" class="stat-chip" data-filtro="Cerrado">
            <div class="stat-ico">
                <svg viewBox="0 0 24 24" fill="none" width="17" height="17" aria-hidden="true"><path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
                <div class="stat-num" data-contador="Cerrado">0</div>
                <div class="stat-txt">Cerrados</div>
            </div>
        </button>
    </section>

    <!-- ====== LISTADO ====== -->
    <section class="card">
        <div class="card-header">
            <div class="card-title">
                <span class="card-dot dot-navy"></span>
                <h2>Tickets</h2>
            </div>
            <button type="button" class="btn-enlace" id="btnActualizar">
                <svg class="hic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.0228 9.34841H21.0154V9.34663M2.98413 19.6444V14.6517M2.98413 14.6517L7.97677 14.6517M2.98413 14.6517L6.16502 17.8347C7.15555 18.8271 8.41261 19.58 9.86436 19.969C14.2654 21.1483 18.7892 18.5364 19.9685 14.1353M4.03073 9.86484C5.21 5.46374 9.73377 2.85194 14.1349 4.03121C15.5866 4.4202 16.8437 5.17312 17.8342 6.1655L21.0154 9.34663M21.0154 4.3558V9.34663"/></svg>
                Actualizar
            </button>
        </div>

        <div class="filtros">
            <div class="campo">
                <label for="fBusca">Buscar</label>
                <input type="search" id="fBusca" placeholder="Número, cliente, correo o asunto">
            </div>
            <div class="campo">
                <label for="fEstado">Estado</label>
                <select id="fEstado">
                    <option value="">Todos</option>
                    <option>Nuevo</option>
                    <option>En curso</option>
                    <option>En espera</option>
                    <option>Resuelto</option>
                    <option>Cerrado</option>
                </select>
            </div>
            <div class="campo">
                <label for="fPrioridad">Prioridad</label>
                <select id="fPrioridad">
                    <option value="">Todas</option>
                    <option>Alta</option>
                    <option>Media</option>
                    <option>Baja</option>
                </select>
            </div>
            <button type="button" class="btn-secundario" id="btnFiltrar">Aplicar filtros</button>
        </div>

        <div class="tabla-admin-envoltura">
            <table class="tabla-admin">
                <caption class="lector-solo">Tickets de soporte con su estado actual</caption>
                <thead>
                    <tr>
                        <th scope="col">Número</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Asunto</th>
                        <th scope="col">Categoría</th>
                        <th scope="col">Prioridad</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Actualizado</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTickets"></tbody>
            </table>
            <div class="estado-vacio" id="estadoVacio" hidden>No hay tickets con esos filtros.</div>
        </div>
    </section>

</main>

<div id="contenedorModal"></div>

<script src="panel.js"></script>
</body>
</html>
