<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415" role="img" aria-label="Mapa de Barranquilla y su área metropolitana: Soledad, Puerto Colombia, Galapa y Malambo, con el río Magdalena y cobertura a domicilio" preserveAspectRatio="xMidYMid slice">
<style>
.mp-txt{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;font-size:10.5px;letter-spacing:.4px;paint-order:stroke;stroke:rgba(5,8,20,.85);stroke-width:3px;stroke-linejoin:round}
.mp-road{stroke:rgba(255,255,255,.24);fill:none;stroke-width:.9}
.mp-road-glow{stroke:rgba(63,208,208,.10);fill:none;stroke-width:3.4}
