.mp-nb2{fill:rgba(143,166,192,.05);stroke:rgba(143,166,192,.45);stroke-width:1}
.mp-cien{fill:rgba(63,208,208,.06);stroke:rgba(63,208,208,.22);stroke-width:.7;stroke-dasharray:2 3}
.mp-city-fill{fill:rgba(143,166,192,.16)}
.mp-city-line{fill:none;stroke:rgba(143,166,192,.9);stroke-width:1.2}
.mp-streets{stroke:rgba(255,255,255,.09);fill:none;stroke-width:.7}
.mp-ave{stroke:rgba(63,208,208,.26);fill:none;stroke-width:1.1}
.mp-river{stroke:#3FD0D0;fill:none;stroke-width:2.4;opacity:.5}
.mp-river-thin{stroke:#3FD0D0;fill:none;stroke-width:1.1;opacity:.34}
.mp-river-glow{stroke:#3FD0D0;fill:none;stroke-width:9;opacity:.08}
.mp-range{fill:none;stroke:rgba(143,166,192,.3);stroke-width:.9;stroke-dasharray:2 5}
.mp-route{stroke:rgba(63,208,208,.45);fill:none;stroke-width:.9}
.mp-route-pulse{stroke:#B7EAEA;fill:none;stroke-width:1.2;stroke-dasharray:3 13;animation:mpRun 2.4s linear infinite}
.mp-zone-dot{fill:#3FD0D0}
.mp-lab{fill:rgba(255,255,255,.74)}
.mp-lab-hi{fill:#8FE0E0}
.mp-dim{fill:rgba(255,255,255,.34)}
.mp-air{fill:rgba(255,255,255,.5)}
.mp-dot{fill:#8FA6C0;stroke:#fff;stroke-width:1.6}
.mp-ping{fill:none;stroke:rgba(143,166,192,.7);stroke-width:1.2;animation:mpPing 2.4s ease-out infinite}
.mp-cross{stroke:rgba(143,166,192,.5);stroke-width:1}
.mp-scale path{stroke:rgba(255,255,255,.4);fill:none;stroke-width:1}
.mp-compass path{fill:rgba(143,166,192,.85)}
.mp-compass text{fill:rgba(143,166,192,.85)}
@keyframes mpPing{0%{r:6;opacity:.9}70%,100%{r:26;opacity:0}}
@keyframes mpRun{to{stroke-dashoffset:-32}}
@media (prefers-reduced-motion:reduce){.mp-route-pulse,.mp-ping{animation:none}}
</style>
